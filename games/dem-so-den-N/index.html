<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinh Phục Đích N - Cổng Game Toán Học</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 sticky top-0 z-10 shadow-lg">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2 rounded-lg text-white">
                    <i class="fa-solid fa-flag-checkered text-xl"></i>
                </div>
                <h1 class="text-xl font-bold text-white">Chinh Phục Đích N</h1>
            </div>
            <!-- Nút quay về trang chủ -->
            <a href="../../index.html" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm font-medium transition flex items-center space-x-2">
                <i class="fa-solid fa-house"></i>
                <span>Trang chủ</span>
            </a>
        </div>
    </header>

    <!-- Game Board -->
    <main class="flex-1 max-w-2xl w-full mx-auto p-4 md:p-6 space-y-6">
        <!-- Cấu hình ban đầu -->
        <div id="nim-setup" class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
            <h3 class="text-2xl font-bold text-white mb-4 flex items-center">
                <i class="fa-solid fa-sliders text-indigo-400 mr-3"></i>Cấu Hình Trò Chơi
            </h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Chế độ chơi:</label>
                    <select id="input-mode" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
                        <option value="pve" selected>🎮 Đấu với Máy (AI)</option>
                        <option value="pvp">👥 2 Người chơi (1v1)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Số đích cần đạt (N):</label>
                    <input type="number" id="input-target" value="20" min="10" max="100" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Số bước tối đa mỗi lượt (K):</label>
                    <select id="input-max-step" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
                        <option value="2">Được chọn cộng 1 hoặc 2</option>
                        <option value="3" selected>Được chọn cộng 1, 2 hoặc 3</option>
                        <option value="4">Được chọn cộng 1, 2, 3 hoặc 4</option>
                    </select>
                </div>
                <button onclick="initGame()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-indigo-600/30">
                    Bắt đầu cuộc đua
                </button>
            </div>
        </div>

        <!-- Bàn chơi chính -->
        <div id="nim-playboard" class="hidden space-y-6">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 text-center space-y-4">
                <div class="flex justify-between items-center text-sm text-slate-400">
                    <span>Mốc đích: <strong id="disp-target" class="text-indigo-400 text-base">20</strong></span>
                    <span>Chế độ: <strong id="disp-mode-name" class="text-emerald-400 text-base">Đấu với Máy</strong></span>
                </div>
                <div class="py-4">
                    <span class="text-sm uppercase tracking-wider text-slate-400">Giá trị hiện tại</span>
                    <div id="disp-current" class="text-6xl font-black text-white mt-1">0</div>
                </div>
                <div id="disp-status" class="py-2 px-4 rounded-xl bg-indigo-500/20 text-indigo-300 font-medium inline-block">
                    Lượt của bạn! Hãy chọn số cộng thêm.
                </div>
            </div>

            <div id="nim-controls" class="bg-slate-800 border border-slate-700 rounded-2xl p-6">
                <p class="text-sm font-medium text-slate-300 mb-3 text-center">Cộng thêm vào giá trị hiện tại:</p>
                <div id="action-buttons" class="grid grid-cols-3 gap-3"></div>
            </div>

            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4">
                <h4 class="text-xs font-semibold text-slate-400 uppercase mb-2">Lịch sử nước đi</h4>
                <div id="nim-history" class="text-sm text-slate-300 space-y-1 max-h-32 overflow-y-auto pr-2">
                    <p class="text-slate-500 italic">Bắt đầu tính từ 0...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Script logic -->
    <script>
        let targetN = 20, maxK = 3, currentNum = 0, isGameOver = false;
        let gameMode = 'pve'; // 'pve' (Đấu Máy) hoặc 'pvp' (2 Người)
        let currentPlayer = 1; // 1 hoặc 2

        function initGame() {
            gameMode = document.getElementById('input-mode').value;
            targetN = parseInt(document.getElementById('input-target').value) || 20;
            maxK = parseInt(document.getElementById('input-max-step').value) || 3;
            currentNum = 0; 
            isGameOver = false; 
            currentPlayer = 1;

            document.getElementById('disp-target').innerText = targetN;
            document.getElementById('disp-mode-name').innerText = (gameMode === 'pve') ? "Đấu với Máy" : "2 Người chơi";
            document.getElementById('disp-current').innerText = currentNum;
            document.getElementById('nim-history').innerHTML = '<p class="text-slate-500 italic">Bắt đầu tính từ 0...</p>';

            document.getElementById('nim-setup').classList.add('hidden');
            document.getElementById('nim-playboard').classList.remove('hidden');

            renderButtons();
            
            const startTurnText = (gameMode === 'pve') ? "Lượt của bạn! Hãy chọn số cộng thêm." : "Lượt của Người chơi 1!";
            updateStatus(startTurnText, "indigo");
        }

        function renderButtons() {
            const container = document.getElementById('action-buttons');
            container.innerHTML = '';
            
            // Khóa nút nếu game kết thúc hoặc đang là lượt của máy trong chế độ PvE
            const isDisabled = isGameOver || (gameMode === 'pve' && currentPlayer === 2);

            for (let i = 1; i <= maxK; i++) {
                const btn = document.createElement('button');
                btn.className = "bg-slate-700 hover:bg-indigo-600 text-white font-bold py-3 rounded-xl transition text-lg disabled:opacity-50 disabled:cursor-not-allowed";
                btn.innerText = "+" + i;
                btn.onclick = () => handleMove(i);
                btn.disabled = isDisabled || (currentNum + i > targetN);
                container.appendChild(btn);
            }
        }

        function handleMove(step) {
            if (isGameOver) return;

            currentNum += step;
            document.getElementById('disp-current').innerText = currentNum;
            
            // Xác định tên người vừa đi
            let actor = "";
            if (gameMode === 'pve') {
                actor = (currentPlayer === 1) ? "Bạn" : "Máy";
            } else {
                actor = `Người chơi ${currentPlayer}`;
            }
            
            addHistory(`${actor} chọn +${step} ➔ Tổng: ${currentNum}`);

            // Kiểm tra chiến thắng
            if (currentNum >= targetN) {
                isGameOver = true;
                if (gameMode === 'pve') {
                    if (currentPlayer === 1) {
                        updateStatus("🎉 CHÚC MỪNG! Bạn đã chạm mốc " + targetN + " và CHIẾN THẮNG!", "emerald");
                    } else {
                        updateStatus("💻 Máy đã chạm mốc " + targetN + ". MÁY THẮNG!", "rose");
                    }
                } else {
                    updateStatus(`🎉 CHÚC MỪNG! Người chơi ${currentPlayer} đã chạm mốc ${targetN} và CHIẾN THẮNG!`, "emerald");
                }
                renderButtons();
                return;
            }

            // Đổi lượt
            currentPlayer = (currentPlayer === 1) ? 2 : 1;
            renderButtons();

            if (gameMode === 'pve' && currentPlayer === 2) {
                updateStatus("Máy đang tính toán chiến thuật...", "amber");
                setTimeout(botMove, 1000);
            } else {
                const turnText = (gameMode === 'pve') ? "Lượt của bạn!" : `Lượt của Người chơi ${currentPlayer}!`;
                const turnColor = (currentPlayer === 1) ? "indigo" : "cyan";
                updateStatus(turnText, turnColor);
            }
        }

        function botMove() {
            if (isGameOver) return;
            let remainder = (targetN - currentNum) % (maxK + 1);
            let botStep = remainder;
            if (remainder === 0 || remainder > maxK) {
                botStep = Math.floor(Math.random() * Math.min(maxK, targetN - currentNum)) + 1;
            }
            handleMove(botStep);
        }

        function updateStatus(text, color) {
            const statusEl = document.getElementById('disp-status');
            statusEl.innerText = text;
            statusEl.className = `py-2 px-4 rounded-xl bg-${color}-500/20 text-${color}-300 font-medium inline-block`;
        }

        function addHistory(text) {
            const historyEl = document.getElementById('nim-history');
            const p = document.createElement('p');
            p.innerText = text;
            historyEl.prepend(p);
        }
    </script>
</body>
</html>
