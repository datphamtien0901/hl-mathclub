<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chinh Phục Đích N — HoaLu Math Club</title>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script>
    window.tailwind = {
      config: {
        theme: {
          extend: {
            fontFamily: { sans: ['Nunito', 'ui-sans-serif', 'system-ui'] }
          }
        }
      }
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { font-family: 'Nunito', system-ui, -apple-system, "Segoe UI", Roboto; background: linear-gradient(180deg,#f0f9ff, #f9fafb); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-3xl bg-white rounded-3xl p-6 shadow-lg">
    <header class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-4">
        <img src="../../logo.png" alt="Logo" class="h-10 w-auto object-contain">
        <div>
          <h1 class="text-xl font-bold text-indigo-600">Chinh Phục Đích N</h1>
          <p class="text-sm text-slate-500">Trò đếm số: ai chạm đúng N sẽ thắng • Có chế độ 1v1 hoặc chơi với máy</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <a href="../../index.html" class="px-3 py-2 rounded-lg bg-amber-400 text-white font-semibold border-b-4 border-amber-600 shadow-md">
          <i class="fa-solid fa-arrow-left mr-2"></i>Trở về
        </a>
      </div>
    </header>

    <main>
      <!-- Controls -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
        <div class="col-span-1 md:col-span-1">
          <label class="block text-sm font-medium text-slate-600">Mục tiêu N</label>
          <input id="inputN" type="number" min="5" value="21" class="mt-1 block w-full rounded-xl border-slate-200 shadow-sm p-2" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600">Bước tối đa k</label>
          <input id="inputK" type="number" min="1" value="3" class="mt-1 block w-full rounded-xl border-slate-200 shadow-sm p-2" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600">Chế độ chơi</label>
          <div class="mt-1 flex gap-2">
            <button id="modePvp" class="mode-btn flex-1 px-3 py-2 rounded-2xl bg-indigo-600 text-white font-semibold">1v1</button>
            <button id="modeCpu" class="mode-btn flex-1 px-3 py-2 rounded-2xl bg-slate-100 text-slate-700 font-semibold">Vs Máy</button>
          </div>
        </div>
      </div>

      <div class="rounded-xl p-4 bg-sky-50 mb-4">
        <div class="flex items-center justify-between">
          <div>
            <div class="text-sm text-slate-500">Mục tiêu</div>
            <div id="target" class="text-3xl font-extrabold text-indigo-700">—</div>
          </div>
          <div>
            <div class="text-sm text-slate-500">Giá trị hiện tại</div>
            <div id="current" class="text-3xl font-extrabold text-emerald-600">0</div>
          </div>
          <div class="text-right">
            <div class="text-sm text-slate-500">Lượt</div>
            <div id="moves" class="text-3xl font-extrabold text-amber-500">0</div>
          </div>
        </div>

        <!-- Progress bar representing current relative to N -->
        <div class="mt-4">
          <div class="w-full h-6 bg-white rounded-full shadow-inner border border-slate-100 overflow-hidden">
            <div id="progress" class="h-6 bg-gradient-to-r from-indigo-500 via-amber-400 to-emerald-400 text-xs text-white flex items-center justify-center" style="width:0%">0%</div>
          </div>
        </div>
      </div>

      <!-- Game board: buttons for steps -->
      <div class="mb-4">
        <div id="turnIndicator" class="text-sm mb-2 font-semibold text-indigo-700">Chuẩn bị...</div>
        <div id="buttons" class="flex flex-wrap gap-3">
          <!-- Buttons generated dynamically based on k -->
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button id="btnStart" class="px-4 py-2 rounded-2xl bg-emerald-500 text-white font-semibold border-b-4 border-emerald-700 shadow-md">Bắt đầu</button>
        <button id="btnReset" class="px-4 py-2 rounded-2xl bg-slate-200 text-slate-700 font-semibold border-b-4 border-slate-400">Khởi tạo lại</button>
        <div id="message" class="ml-auto text-slate-600 font-medium"></div>
      </div>

      <div class="mt-4 text-sm text-slate-500">
        <p><strong>Luật chơi:</strong> Bắt đầu từ 0, mỗi lượt người chơi được thêm 1 tới k. Ai chọn đúng số N sẽ thắng.</p>
      </div>
    </main>
  </div>

  <script>
    // Elements
    const inputN = document.getElementById('inputN');
    const inputK = document.getElementById('inputK');
    const modePvp = document.getElementById('modePvp');
    const modeCpu = document.getElementById('modeCpu');
    const targetEl = document.getElementById('target');
    const currentEl = document.getElementById('current');
    const movesEl = document.getElementById('moves');
    const progressEl = document.getElementById('progress');
    const buttonsEl = document.getElementById('buttons');
    const turnIndicator = document.getElementById('turnIndicator');
    const btnStart = document.getElementById('btnStart');
    const btnReset = document.getElementById('btnReset');
    const messageEl = document.getElementById('message');

    // State
    let N = 21;
    let k = 3;
    let current = 0;
    let moves = 0;
    let mode = 'pvp'; // 'pvp' or 'cpu'
    let playerTurn = 1; // 1 or 2 (2 = CPU when mode='cpu')
    let running = false;

    function setMode(newMode) {
      mode = newMode;
      if (mode === 'pvp') {
        modePvp.classList.add('bg-indigo-600', 'text-white');
        modePvp.classList.remove('bg-slate-100', 'text-slate-700');
        modeCpu.classList.remove('bg-indigo-600','text-white');
        modeCpu.classList.add('bg-slate-100','text-slate-700');
      } else {
        modeCpu.classList.add('bg-indigo-600','text-white');
        modeCpu.classList.remove('bg-slate-100','text-slate-700');
        modePvp.classList.remove('bg-indigo-600','text-white');
        modePvp.classList.add('bg-slate-100','text-slate-700');
      }
    }

    function renderButtons() {
      buttonsEl.innerHTML = '';
      for (let i = 1; i <= k; i++) {
        const btn = document.createElement('button');
        btn.className = 'px-4 py-2 rounded-lg bg-indigo-600 text-white font-semibold border-b-4 border-indigo-800 shadow-md hover:bg-indigo-700';
        btn.textContent = '+' + i;
        btn.dataset.step = i;
        btn.addEventListener('click', () => playerMove(Number(btn.dataset.step)));
        buttonsEl.appendChild(btn);
      }
    }

    function updateUI() {
      targetEl.textContent = N;
      currentEl.textContent = current;
      movesEl.textContent = moves;
      const percent = Math.min(100, Math.round((current / N) * 100));
      progressEl.style.width = percent + '%';
      progressEl.textContent = percent + '%';

      if (!running) {
        turnIndicator.textContent = 'Nhấn Bắt đầu để chơi';
      } else {
        if (mode === 'pvp') {
          turnIndicator.textContent = `Lượt: Người chơi ${playerTurn} ${playerTurn === 1 ? '🟦' : '🟧'}`;
        } else {
          turnIndicator.textContent = `Lượt: ${playerTurn === 1 ? 'Bạn 🧑' : 'Máy 🤖'}`;
        }
      }
    }

    function setControlsEnabled(enabled) {
      const btns = buttonsEl.querySelectorAll('button');
      btns.forEach(b => {
        b.disabled = !enabled;
        if (!enabled) {
          b.classList.add('opacity-50','cursor-not-allowed');
        } else {
          b.classList.remove('opacity-50','cursor-not-allowed');
        }
      });
    }

    function playerMove(step) {
      if (!running) return;
      if (current + step > N) {
        messageEl.textContent = 'Bước quá lớn — không được vượt quá N';
        return;
      }
      current += step;
      moves += 1;
      messageEl.textContent = '';
      updateUI();
      checkEndOrContinue();
    }

    function checkEndOrContinue() {
      if (current === N) {
        running = false;
        const winner = (mode === 'pvp') ? `Người chơi ${playerTurn}` : (playerTurn === 1 ? 'Bạn' : 'Máy');
        messageEl.innerHTML = `<span class="text-green-600 font-bold">${winner} thắng! 🎉</span>`;
        setControlsEnabled(false);
        turnIndicator.textContent = 'Trò chơi kết thúc';
        return;
      }
      // switch turn
      playerTurn = (playerTurn === 1) ? 2 : 1;
      updateUI();

      if (mode === 'cpu' && playerTurn === 2 && running) {
        // CPU turn
        setControlsEnabled(false);
        turnIndicator.textContent = 'Máy đang suy nghĩ... 🤖';
        setTimeout(cpuMove, 800 + Math.random() * 700);
      } else {
        setControlsEnabled(true);
      }
    }

    function cpuMove() {
      // Optimal strategy for the subtraction game
      // Want to pick r in [1..k] such that (N - (current + r)) % (k+1) === 0
      let r = ((N - current) % (k + 1));
      if (r === 0) {
        // no winning move, pick random valid move that doesn't exceed N
        const maxStep = Math.min(k, N - current);
        r = Math.floor(Math.random() * maxStep) + 1;
      } else if (r < 0) {
        // safety
        const maxStep = Math.min(k, N - current);
        r = Math.floor(Math.random() * maxStep) + 1;
      } else if (r > k || r > (N - current)) {
        // can't play r because it's too large, choose nearest valid
        r = Math.min(k, N - current);
      }

      // perform move
      current += r;
      moves += 1;
      messageEl.textContent = `Máy chọn +${r}`;
      updateUI();
      checkEndOrContinue();
    }

    // Start/reset handlers
    btnStart.addEventListener('click', () => {
      // parse inputs
      const nVal = Number(inputN.value) || 21;
      const kVal = Number(inputK.value) || 3;
      if (nVal <= 0 || kVal <= 0) {
        alert('Vui lòng đặt N > 0 và k > 0');
        return;
      }
      N = Math.max(5, Math.floor(nVal));
      k = Math.max(1, Math.floor(kVal));
      current = 0;
      moves = 0;
      running = true;
      playerTurn = 1; // player 1 starts
      renderButtons();
      updateUI();
      setControlsEnabled(true);
      messageEl.textContent = 'Trò chơi bắt đầu!';
      // If mode cpu and CPU starts? always player starts for simplicity
      // if you want CPU first, flip playerTurn
    });

    btnReset.addEventListener('click', () => {
      running = false;
      current = 0;
      moves = 0;
      N = Number(inputN.value) || 21;
      k = Number(inputK.value) || 3;
      playerTurn = 1;
      renderButtons();
      updateUI();
      setControlsEnabled(false);
      messageEl.textContent = 'Đã khởi tạo lại';
    });

    // Mode buttons
    modePvp.addEventListener('click', () => setMode('pvp'));
    modeCpu.addEventListener('click', () => setMode('cpu'));

    // Init
    setMode('pvp');
    renderButtons();
    updateUI();
    setControlsEnabled(false);
  </script>
</body>
</html>
