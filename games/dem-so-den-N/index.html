<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chinh Phục Đích N — HoaLu Math Club</title>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-p6OZb6m6kq6+Qm5Y1s6f0g1JY7T1P0Y5w0g6vD05u5r0f2xgq7z0q7z0q7z0q7z0q7z0q7z0q7z0q7z0q7z0q7z==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script>
    window.tailwind = {
      config: {
        theme: {
          extend: {
            fontFamily: { sans: ['Nunito', 'ui-sans-serif', 'system-ui'] }
          }
        }
      }
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { font-family: 'Nunito', system-ui, -apple-system, "Segoe UI", Roboto; background: #f8fafc; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-2xl bg-white rounded-3xl p-6 shadow-lg">
    <header class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-4">
        <img src="../../logo.png" alt="Logo" class="h-10 w-auto object-contain">
        <div>
          <h1 class="text-xl font-bold text-indigo-600">Chinh Phục Đích N</h1>
          <p class="text-sm text-slate-500">Số học &amp; Chiến thuật • Bản demo</p>
        </div>
      </div>
      <a href="../../index.html" class="px-3 py-2 rounded-lg bg-amber-400 text-white font-semibold border-b-4 border-amber-600 shadow-md">
        <i class="fa-solid fa-arrow-left mr-2"></i>Trở về
      </a>
    </header>

    <main>
      <p class="text-slate-600 mb-4">Mục tiêu: Đạt chính xác một số N bằng cách nhấn các nút +1 hoặc +5. Cố gắng ít lượt nhất có thể!</p>

      <div class="bg-sky-50 p-4 rounded-xl mb-4">
        <div class="flex items-center justify-between">
          <div>
            <div class="text-sm text-slate-500">Mục tiêu</div>
            <div id="target" class="text-3xl font-extrabold text-indigo-700">—</div>
          </div>
          <div>
            <div class="text-sm text-slate-500">Giá trị hiện tại</div>
            <div id="current" class="text-3xl font-extrabold text-emerald-600">0</div>
          </div>
          <div class="text-right">
            <div class="text-sm text-slate-500">Lượt</div>
            <div id="moves" class="text-3xl font-extrabold text-amber-500">0</div>
          </div>
        </div>
      </div>

      <div class="flex gap-3 mb-4">
        <button id="btnPlus1" class="flex-1 px-4 py-3 rounded-2xl bg-indigo-600 text-white font-semibold shadow-indigo-100 border-b-4 border-indigo-800 hover:bg-indigo-700">
          +1
        </button>
        <button id="btnPlus5" class="flex-1 px-4 py-3 rounded-2xl bg-emerald-500 text-white font-semibold shadow-md border-b-4 border-emerald-700 hover:bg-emerald-600">
          +5
        </button>
        <button id="btnReset" class="px-4 py-3 rounded-2xl bg-slate-200 text-slate-700 font-semibold border-b-4 border-slate-400 hover:bg-slate-300">
          Khởi tạo lại
        </button>
      </div>

      <div id="message" class="text-center text-slate-600"></div>

      <div class="mt-6 text-sm text-slate-500">
        <p><strong>Gợi ý:</strong> Suy nghĩ chiến lược: dùng nhiều +5 khi gần mục tiêu, tinh chỉnh bằng +1.</p>
      </div>
    </main>
  </div>

  <script>
    // Simple demo logic
    const targetEl = document.getElementById('target');
    const currentEl = document.getElementById('current');
    const movesEl = document.getElementById('moves');
    const messageEl = document.getElementById('message');
    const btnPlus1 = document.getElementById('btnPlus1');
    const btnPlus5 = document.getElementById('btnPlus5');
    const btnReset = document.getElementById('btnReset');

    let target = 0;
    let current = 0;
    let moves = 0;

    function newGame() {
      // random target between 10 and 50 for demo
      target = Math.floor(Math.random() * 41) + 10;
      current = 0;
      moves = 0;
      updateUI();
      messageEl.textContent = 'Bắt đầu nào! 🎯';
    }

    function updateUI() {
      targetEl.textContent = target;
      currentEl.textContent = current;
      movesEl.textContent = moves;
    }

    function checkWin() {
      if (current === target) {
        messageEl.innerHTML = 'Chúc mừng! Bạn đã chinh phục mục tiêu trong ' + moves + ' lượt 🎉';
        // Disable buttons
        btnPlus1.disabled = true;
        btnPlus5.disabled = true;
        btnPlus1.classList.add('opacity-50', 'cursor-not-allowed');
        btnPlus5.classList.add('opacity-50', 'cursor-not-allowed');
      } else if (current > target) {
        messageEl.innerHTML = 'Bạn đã vượt quá mục tiêu. Nhấn "Khởi tạo lại" để chơi lại 😅';
        btnPlus1.disabled = true;
        btnPlus5.disabled = true;
        btnPlus1.classList.add('opacity-50', 'cursor-not-allowed');
        btnPlus5.classList.add('opacity-50', 'cursor-not-allowed');
      } else {
        messageEl.textContent = 'Tiếp tục nào — suy nghĩ chiến lược! 🤓';
      }
    }

    btnPlus1.addEventListener('click', () => {
      current += 1;
      moves += 1;
      updateUI();
      checkWin();
    });

    btnPlus5.addEventListener('click', () => {
      current += 5;
      moves += 1;
      updateUI();
      checkWin();
    });

    btnReset.addEventListener('click', () => {
      // re-enable buttons
      btnPlus1.disabled = false;
      btnPlus5.disabled = false;
      btnPlus1.classList.remove('opacity-50','cursor-not-allowed');
      btnPlus5.classList.remove('opacity-50','cursor-not-allowed');
      newGame();
    });

    // start automatically
    newGame();
  </script>
</body>
</html>
