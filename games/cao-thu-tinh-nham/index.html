<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cao thủ tính nhẩm — HoaLu Math Club</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body{font-family:Nunito,system-ui,-apple-system,Segoe UI,Roboto;background:linear-gradient(180deg,#f0f9ff,#f9fafc)}
    .btn{transition:transform 120ms ease,box-shadow 120ms ease}
    .btn:hover{transform:translateY(-3px)}
    .timer-bar{transition:width 200ms linear}
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-5xl bg-white rounded-3xl p-6 shadow-lg">
    <header class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-4">
        <!-- use a calculator icon instead of logo -->
        <div class="w-10 h-10 rounded-full bg-gradient-to-r from-indigo-600 to-emerald-400 flex items-center justify-center text-white text-lg">
          <i class="fa-solid fa-calculator"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-indigo-700">Cao thủ tính nhẩm</h1>
          <p class="text-sm text-slate-500">Rèn nhanh trí não — Solo hoặc 1v1</p>
        </div>
      </div>
      <a href="../../index.html" class="px-3 py-2 rounded-lg bg-amber-400 text-white font-semibold border-b-4 border-amber-600 shadow-md">Trở về</a>
    </header>

    <main>
      <section id="settings" class="mb-4">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-3">
          <div>
            <label class="text-sm text-slate-600">Chế độ</label>
            <select id="mode" class="mt-1 block w-full rounded-xl p-2 border border-slate-200">
              <option value="solo">Solo</option>
              <option value="pvp">1v1</option>
            </select>
          </div>
          <div>
            <label class="text-sm text-slate-600">Thời gian (giây)</label>
            <input id="duration" type="number" min="10" value="30" class="mt-1 block w-full rounded-xl p-2 border border-slate-200" />
          </div>
          <div>
            <label class="text-sm text-slate-600">Số phép (solo) / Mỗi người (1v1)</label>
            <input id="perRound" type="number" min="1" value="9999" placeholder="(trống để chạy theo thời gian)" class="mt-1 block w-full rounded-xl p-2 border border-slate-200" />
          </div>
          <div class="flex items-end">
            <button id="start" class="btn px-4 py-2 rounded-2xl bg-emerald-500 text-white font-semibold border-b-4 border-emerald-700">Bắt đầu</button>
          </div>
        </div>
      </section>

      <!-- game area -->
      <section id="game" class="hidden">
        <div id="soloArea" class="">
          <div class="flex items-center gap-4 mb-4">
            <div class="flex-1 text-center">
              <div class="text-sm text-slate-500">Câu hỏi</div>
              <div id="question" class="text-3xl font-bold text-indigo-700">—</div>
            </div>
            <div class="w-48">
              <div class="text-sm text-slate-500">Thời gian còn lại</div>
              <div class="w-full h-4 bg-slate-100 rounded-full overflow-hidden mt-2"><div id="timeBar" class="h-4 bg-indigo-500 timer-bar" style="width:100%"></div></div>
            </div>
            <div class="w-40 text-center">
              <div class="text-sm text-slate-500">Đúng</div>
              <div id="score" class="text-2xl font-bold text-emerald-600">0</div>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-3" id="optionsSolo">
            <!-- option buttons inserted here -->
          </div>
          <div class="flex gap-3 items-center">
            <button id="skip" class="btn px-4 py-3 rounded-2xl bg-slate-200">Bỏ qua</button>
            <div class="ml-auto text-sm text-slate-500">Chọn đáp án đúng để nhận điểm</div>
          </div>
        </div>

        <div id="pvpArea" class="hidden grid grid-cols-2 gap-4">
          <!-- Player 1 -->
          <div class="p-4 border rounded-lg">
            <div class="text-sm text-slate-500">Người chơi 1</div>
            <div id="q1" class="text-2xl font-bold text-indigo-700 my-3">—</div>
            <div class="grid grid-cols-3 gap-2" id="opts1"></div>
            <div class="flex items-center justify-between mt-3">
              <div class="text-sm text-slate-500">Đúng: <span id="s1" class="font-bold text-emerald-600">0</span></div>
            </div>
          </div>
          <!-- Player 2 -->
          <div class="p-4 border rounded-lg">
            <div class="text-sm text-slate-500">Người chơi 2</div>
            <div id="q2" class="text-2xl font-bold text-indigo-700 my-3">—</div>
            <div class="grid grid-cols-3 gap-2" id="opts2"></div>
            <div class="flex items-center justify-between mt-3">
              <div class="text-sm text-slate-500">Đúng: <span id="s2" class="font-bold text-emerald-600">0</span></div>
            </div>
          </div>
        </div>

        <div class="mt-4 flex items-center gap-3">
          <button id="end" class="btn px-4 py-2 rounded-2xl bg-slate-200">Kết thúc</button>
          <div id="resultMsg" class="ml-auto text-slate-600 font-medium"></div>
        </div>

      </section>

      <!-- post-game registration -->
      <section id="postForm" class="hidden mt-6">
        <div class="p-4 rounded-lg bg-sky-50">
          <h3 class="font-semibold text-indigo-700">Ghi danh người chiến thắng</h3>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-3">
            <input id="regName" placeholder="Họ và tên" class="p-2 rounded-xl border border-slate-200" />
            <input id="regClass" placeholder="Lớp" class="p-2 rounded-xl border border-slate-200" />
            <button id="regBtn" class="btn px-4 py-2 rounded-2xl bg-amber-400 text-white">Ghi danh</button>
          </div>
          <p class="mt-2 text-sm text-slate-500">Thông tin lưu cục bộ và sẽ hiện trong Top thử thách.</p>
        </div>
      </section>

    </main>
  </div>

  <script>
    // Improved sound: click
    const AudioCtx = window.AudioContext || window.webkitAudioContext; let audioCtx=null; function ensureAudio(){ if(!audioCtx) audioCtx=new AudioCtx(); }
    function clickSound(){ try{ ensureAudio(); const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type='sine'; o.frequency.value=880; o.connect(g); g.connect(audioCtx.destination); g.gain.value=0.0001; const n=audioCtx.currentTime; g.gain.linearRampToValueAtTime(0.08,n+0.001); g.gain.exponentialRampToValueAtTime(0.001,n+0.12); o.start(n); o.stop(n+0.12);}catch(e){} }

    // keep win music/confetti functions from previous version
    let winNodes = {oscillators:[],gains:[],intervalId:null};
    function startWinMusic(){ try{ ensureAudio(); stopWinMusic(); const now=audioCtx.currentTime; const padFreqs=[261.63,329.63,392.00]; padFreqs.forEach((f)=>{ const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.type='triangle'; o.frequency.value=f; g.gain.value=0.0001; o.connect(g); g.connect(audioCtx.destination); g.gain.linearRampToValueAtTime(0.06, now+0.05); o.start(now); winNodes.oscillators.push(o); winNodes.gains.push(g); }); const bass=audioCtx.createOscillator(); const bg=audioCtx.createGain(); bass.type='sine'; bass.frequency.value=65; bg.gain.value=0.0001; bass.connect(bg); bg.connect(audioCtx.destination); bg.gain.linearRampToValueAtTime(0.05, now+0.05); bass.start(now); winNodes.oscillators.push(bass); winNodes.gains.push(bg); winNodes.intervalId = setInterval(()=>{ const arp=[523.25,659.25,783.99,1046.5]; arp.forEach((f,i)=>{ const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(audioCtx.destination); const t=audioCtx.currentTime; g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.12,t+0.01+i*0.02); g.gain.exponentialRampToValueAtTime(0.001,t+0.35+i*0.02); o.start(t); o.stop(t+0.45); }); }, 650); }catch(e){} }
    function stopWinMusic(){ try{ if(winNodes.intervalId){ clearInterval(winNodes.intervalId); winNodes.intervalId=null; } if(winNodes.oscillators){ const t=audioCtx.currentTime; winNodes.gains.forEach(g=>{ try{ g.gain.exponentialRampToValueAtTime(0.0001,t+0.3); }catch(e){} }); winNodes.oscillators.forEach(o=>{ try{ o.stop(t+0.35); }catch(e){} }); } winNodes = {oscillators:[],gains:[],intervalId:null}; }catch(e){} }

    // Confetti helper
    const confettiCanvas=document.createElement('canvas'); confettiCanvas.style.position='fixed'; confettiCanvas.style.inset=0; confettiCanvas.style.pointerEvents='none'; confettiCanvas.style.zIndex=1100; document.body.appendChild(confettiCanvas); const ctx=confettiCanvas.getContext('2d'); function resize(){ confettiCanvas.width=window.innerWidth; confettiCanvas.height=window.innerHeight;} window.addEventListener('resize',resize); resize(); let parts=[]; function launchConfetti(n=80){ parts=[]; const cols=['#f97316','#f59e0b','#4f46e5','#10b981','#ec4899','#06b6d4']; for(let i=0;i<n;i++){ parts.push({x:Math.random()*confettiCanvas.width,y:Math.random()*-confettiCanvas.height/2,w:6+Math.random()*12,h:8+Math.random()*14,angle:Math.random()*360,sx:-2+Math.random()*4,sy:2+Math.random()*6,rot:-0.1+Math.random()*0.2,color:cols[Math.floor(Math.random()*cols.length)],g:0.02+Math.random()*0.08}); } run(); }
    let anim=false; function run(){ if(anim) return; anim=true; let last=performance.now(); function f(now){ const dt=(now-last)/16.666; last=now; ctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height); for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.x+=p.sx*dt; p.y+=p.sy*dt; p.sy+=p.g*dt; p.angle+=p.rot*dt; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.angle); ctx.fillStyle=p.color; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); if(p.y>confettiCanvas.height+50) parts.splice(i,1); } if(parts.length>0) requestAnimationFrame(f); else anim=false; } requestAnimationFrame(f); }
    function stopConfetti(){ parts=[]; ctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height); }

    // Arithmetic generator
    function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
    function genOne(){ const ops=['+','-','*','/']; const op=ops[randInt(0,ops.length-1)]; if(op==='+'||op==='-'){ const a=randInt(10,99); const b=randInt(1,9); return {a,b,op,expr:`${a} ${op} ${b}`, answer: eval(`${a}${op}${b}`)} } else { const a=randInt(1,9); const b=randInt(1,9); if(op==='*') return {a,b,op,expr:`${a} × ${b}`, answer: a*b}; const prod=a*b; return {a:prod, b:a, op:'/', expr:`${prod} ÷ ${a}`, answer: b}; }
    }

    // create 3-option choices (one correct + two distractors)
    function makeOptions(correct){
      const opts = new Set();
      opts.add(correct);
      const spread = Math.max(2, Math.round(Math.abs(correct)*0.2)+1);
      while(opts.size < 3){
        let delta = randInt(1, Math.max(3, spread));
        if(Math.random()<0.5) delta = -delta;
        let cand = correct + delta;
        if(cand === correct) cand = correct + (delta>0? -1:1);
        if(cand < -1000 || cand > 100000) continue;
        opts.add(cand);
      }
      const arr = Array.from(opts);
      // shuffle
      for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
      return arr;
    }

    // Game vars
    let mode='solo', duration=30, timer=null, timeLeft=0; let score=0; let question=null;
    let s1=0,s2=0, q1=null,q2=null; let countdownId=null; let correctSolo=null;

    const startBtn=document.getElementById('start');
    const settings=document.getElementById('settings');
    const game=document.getElementById('game');
    const soloArea=document.getElementById('soloArea');
    const pvpArea=document.getElementById('pvpArea');

    const questionEl=document.getElementById('question');
    const optionsSolo=document.getElementById('optionsSolo');
    const scoreEl=document.getElementById('score');
    const timeBar=document.getElementById('timeBar');

    const q1El=document.getElementById('q1'); const opts1=document.getElementById('opts1'); const s1El=document.getElementById('s1');
    const q2El=document.getElementById('q2'); const opts2=document.getElementById('opts2'); const s2El=document.getElementById('s2');

    const endBtn=document.getElementById('end'); const resultMsg=document.getElementById('resultMsg');
    const postForm=document.getElementById('postForm'); const regName=document.getElementById('regName'); const regClass=document.getElementById('regClass'); const regBtn=document.getElementById('regBtn');

    function showSettings(){ settings.classList.remove('hidden'); game.classList.add('hidden'); postForm.classList.add('hidden'); stopWinMusic(); stopConfetti(); }
    function showGame(){ settings.classList.add('hidden'); game.classList.remove('hidden'); }

    startBtn.addEventListener('click', ()=>{
      mode=document.getElementById('mode').value; duration=Number(document.getElementById('duration').value)||30;
      score=0; s1=0; s2=0; timeLeft=duration; resultMsg.textContent=''; postForm.classList.add('hidden');
      settings.classList.add('hidden'); game.classList.remove('hidden');
      if(mode==='solo'){ soloArea.classList.remove('hidden'); pvpArea.classList.add('hidden'); startSolo(); }
      else { soloArea.classList.add('hidden'); pvpArea.classList.remove('hidden'); startPvp(); }
    });

    // Solo game
    function startSolo(){ question=genOne(); correctSolo=question.answer; renderSolo(); score=0; scoreEl.textContent=score; timeLeft=duration; updateTimeBar(); timer=setInterval(()=>{ timeLeft--; updateTimeBar(); if(timeLeft<=0) endSolo(); },1000); }
    function renderSolo(){ questionEl.textContent = question.expr; const opts = makeOptions(question.answer); optionsSolo.innerHTML=''; opts.forEach(v=>{ const b=document.createElement('button'); b.className='btn px-4 py-3 rounded-2xl bg-indigo-600 text-white font-semibold'; b.textContent = v; b.addEventListener('click', ()=>{ clickSound(); if(v===question.answer){ score++; scoreEl.textContent=score; } question=genOne(); renderSolo(); }); optionsSolo.appendChild(b); }); }
    function updateTimeBar(){ const pct=Math.max(0,(timeLeft/duration)*100); timeBar.style.width=pct+'%'; }
    document.getElementById('skip').addEventListener('click', ()=>{ clickSound(); question=genOne(); renderSolo(); });
    function endSolo(){ clearInterval(timer); resultMsg.textContent=`Kết thúc — Đúng: ${score}`; postForm.classList.remove('hidden'); postForm.scrollIntoView({behavior:'smooth'});
      regBtn.onclick = ()=>{ const name=regName.value.trim(); const cls=regClass.value.trim(); if(!name){ alert('Nhập họ tên'); return;} saveToBoard({name, class:cls, game:'Cao thủ tính nhẩm (Solo)', score, note:`Đúng ${score}`, ts:new Date().toISOString()}); alert('Đã ghi danh!'); regName.value=''; regClass.value=''; }
      startWinMusic(); launchConfetti(120);
    }

    // PVP game
    function startPvp(){ q1=genOne(); q2=genOne(); renderPvp(); s1=0; s2=0; s1El.textContent=s1; s2El.textContent=s2; timeLeft=duration; updateTimeBar(); countdownId=setInterval(()=>{ timeLeft--; updateTimeBar(); if(timeLeft<=0) endPvp(); },1000); }
    function renderPvp(){ q1El.textContent=q1.expr; q2El.textContent=q2.expr; opts1.innerHTML=''; opts2.innerHTML=''; const o1=makeOptions(q1.answer); o1.forEach(v=>{ const b=document.createElement('button'); b.className='btn px-3 py-2 rounded-md bg-indigo-600 text-white'; b.textContent=v; b.addEventListener('click', ()=>{ clickSound(); if(v===q1.answer){ s1++; s1El.textContent=s1; } q1=genOne(); renderPvp(); }); opts1.appendChild(b); }); const o2=makeOptions(q2.answer); o2.forEach(v=>{ const b=document.createElement('button'); b.className='btn px-3 py-2 rounded-md bg-indigo-600 text-white'; b.textContent=v; b.addEventListener('click', ()=>{ clickSound(); if(v===q2.answer){ s2++; s2El.textContent=s2; } q2=genOne(); renderPvp(); }); opts2.appendChild(b); }); }
    function endPvp(){ clearInterval(countdownId); resultMsg.textContent=`Kết thúc — Người 1: ${s1} | Người 2: ${s2}`; postForm.classList.remove('hidden'); postForm.scrollIntoView({behavior:'smooth'}); let winner=null; if(s1>s2) winner={name:'Người chơi 1', score:s1}; else if(s2>s1) winner={name:'Người chơi 2', score:s2}; else winner={name:'Hòa', score:s1}; if(winner.name!=='Hòa'){ startWinMusic(); launchConfetti(140); }
      regBtn.onclick = ()=>{ const name=regName.value.trim(); const cls=regClass.value.trim(); if(!name){ alert('Nhập họ tên'); return;} saveToBoard({name, class:cls, game:'Cao thủ tính nhẩm (1v1)', score: winner.score, note:`${winner.name} — ${winner.score} đáp án`, ts:new Date().toISOString()}); alert('Đã ghi danh!'); regName.value=''; regClass.value=''; }
    }

    endBtn.addEventListener('click', ()=>{ stopWinMusic(); stopConfetti(); showSettings(); });

    // Save helper
    function saveToBoard(item){ try{ const raw=localStorage.getItem('hl_leaderboard'); const arr=raw?JSON.parse(raw):[]; arr.push(item); localStorage.setItem('hl_leaderboard',JSON.stringify(arr)); }catch(e){} }

  </script>
</body>
</html>
